<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Cartiva</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i class="fas fa-shopping-bag"></i></div>
        Cart<span>iva</span>
      </a>

      <form action="products.html" method="GET" class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" name="q" class="form-control" placeholder="Search iPhone, Laptops, Shoes, Earbuds...">
      </form>

      <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Products</a>
      </nav>

      <div class="nav-actions">
        <a href="wishlist.html" class="icon-btn" title="Saved Wishlist">
          <i class="fas fa-heart"></i>
          <span class="badge wishlist-badge" style="background-color: var(--danger); display: none;">0</span>
        </a>

        <a href="cart.html" class="icon-btn" title="Shopping Cart">
          <i class="fas fa-shopping-cart"></i>
          <span class="badge cart-badge" style="display: none;">0</span>
        </a>

        <div id="userNavAction">
          <a href="login.html" class="btn btn-primary btn-sm">
            <i class="fas fa-user"></i> Login
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--dark);"><i class="fas fa-box-open" style="color: var(--primary);"></i> My Orders</h1>
        <p style="color: var(--text-muted);">Track your recent purchases and check shipping status</p>
      </div>

      <!-- Orders List Container -->
      <div id="ordersListContainer" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <!-- Rendered by script.js -->
      </div>

      <!-- Empty Orders State -->
      <div id="emptyOrdersState" style="display: none; text-align: center; padding: 4rem 2rem; background-color: var(--bg-main); border: 1px solid var(--border-color); border-radius: var(--radius-lg);">
        <i class="fas fa-box" style="font-size: 3.5rem; color: var(--text-light); margin-bottom: 1rem;"></i>
        <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-bottom: 0.5rem;">No Orders Found</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">You haven't placed any orders with Cartiva yet.</p>
        <a href="products.html" class="btn btn-primary">Start Shopping</a>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Cartiva E-Commerce Inc. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script src="./static/js/products-data.js"></script>
  <script src="./static/js/script.js"></script>
</body>
</html>
